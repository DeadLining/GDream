[project]
name = "ai-comic-studio-api"
version = "0.7.0"
description = "Local API for the AI Comic Studio production workspace"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "charset-normalizer>=3.4,<4",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "json-repair>=0.52,<1",
  "pillow>=11.3,<13",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6.0,<7",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-anyio>=0.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
comic-studio = "comic_studio.cli:main"


[tool.hatch.build.targets.wheel]
packages = ["comic_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
